[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netra-ocr"
version = "0.2.0"
description = "Khmer OCR engine using a Squeeze-and-Excitation Transformer network for text-line recognition, with pluggable text detectors (YOLO, Tesseract, classic CV)."
readme = "readme.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Nhem Darayut", email = "darayutnhem009@gmail.com"},
]
keywords = ["khmer", "ocr", "text-recognition", "transformer", "deep-learning", "pytorch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# Core dependencies — the default YOLO detector, the classic-CV ("legacy")
# detector, and the recognition model all work with just these.
dependencies = [
    "pillow>=10.2.0,<11.0.0",
    "numpy",
    "opencv-python",
    "tqdm",
    "transformers>=4.47.0,<5.0.0",
    "torch>=2.0",
    "torchvision",
    "python-docx",
    "ultralytics",
    "huggingface_hub>=0.20",
]

[project.optional-dependencies]
# The Tesseract detector backend (netra_ocr/engine.py) pulls in heavier deps and
# also needs the system Tesseract binary installed separately.
tesseract = ["pytesseract", "scipy", "scikit-image", "networkx"]
# The Flask browser UI (app.py).
web = ["flask"]

[project.urls]
Homepage = "https://github.com/netra-ai-lab/Khmer-OCR-CNN-Transformer"
Repository = "https://github.com/netra-ai-lab/Khmer-OCR-CNN-Transformer"
"Model Download" = "https://huggingface.co/Darayut/khmer-text-recognition"

[project.scripts]
netra_ocr = "netra_ocr.ocr_engine:main"

[tool.setuptools.packages.find]
include = ["netra_ocr*"]
# Without this, setuptools treats any directory under netra_ocr* as an
# implicit PEP 420 namespace package even without __init__.py, which would
# pull netra_ocr/recognition/archive/ (intentionally not a package -- see
# its own contents) into the wheel.
namespaces = false

[tool.setuptools]
# Keep this false: with include-package-data the build would pull in EVERY git-tracked
# file inside the packages (all ~600 MB of checkpoints), ignoring the selective globs
# below. Only the explicit package-data globs are shipped in the wheel.
include-package-data = false

# The YOLO detector weights are bundled (~20 MB) since they're small and needed
# immediately. The recognition weight is NOT bundled -- it's ~77 MB, so it's
# downloaded on first use from https://huggingface.co/Darayut/khmer-text-recognition
# and cached locally by huggingface_hub instead. Only the (tiny) vocab JSON
# files are bundled here.
[tool.setuptools.package-data]
"netra_ocr.detectors" = ["yolo26s_best/best.pt", "yolo26s_best/args.yaml"]
"netra_ocr.recognition" = ["*.json"]
